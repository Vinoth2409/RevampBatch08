name: Node Basic Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch: 

jobs:
  node:
    runs-on: wsl-linux

    steps:
      - name: Clone code
        uses: actions/checkout@v7

      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Run the application
        run: |
          node app.js &
          sleep 5
          curl http://localhost:8080
          pkill -f "node app.js"
          
